name: CI Integration Test Suite

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with mock server
      run: |
        # Start mock server in background
        npm run mock:server &
        
        # Wait for server to start
        sleep 5
        
        # Run tests
        npm run test:run
      env:
        NODE_ENV: test