# PR-triggered preview. The build/deploy/teardown mechanics live in the two
# reusable workflows so this file and CD_preview_ondemand.yml cannot drift.
#
# By default a PR preview talks to the staging API. Add the "preview-backend"
# label to the PR to get a throwaway API + database instead -- use that when the
# branch depends on unreleased OcotilloAPI changes.
name: Preview deploy to Cloud Run

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches-ignore:
      - production

jobs:
  deploy:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/_preview_deploy.yml
    secrets: inherit
    with:
      branch: ${{ github.head_ref }}
      # Build the merge result, not the head commit, which is what
      # actions/checkout does by default on pull_request.
      checkout_ref: refs/pull/${{ github.event.pull_request.number }}/merge
      backend: ${{ contains(github.event.pull_request.labels.*.name, 'preview-backend') && 'ephemeral' || 'staging' }}
      # No TTL: the teardown job below owns the lifetime of a PR preview, so the
      # nightly sweep must not delete one out from under a long-lived PR.
      ttl_hours: 0

  comment:
    needs: deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR with preview URL
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$(cat <<EOF
          ## Preview Deployment

          **Preview URL:** $PREVIEW_URL

          **API:** $API_URL
          EOF
          )"

  teardown:
    if: github.event.action == 'closed'
    uses: ./.github/workflows/_preview_teardown.yml
    secrets: inherit
    with:
      branch: ${{ github.head_ref }}
