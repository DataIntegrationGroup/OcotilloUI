name: Preview deploy to Cloud Run

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches-ignore:
      - main
      - master
      - production
      - staging

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/production' && github.ref != 'refs/heads/staging')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        env:
          GCP_PROJECT_ID: waterdatainitiative-271000
        run: |
          gcloud config set project $GCP_PROJECT_ID
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Load secrets
        env:
          GCP_PROJECT_ID: waterdatainitiative-271000
        run: |
          set -euo pipefail
          echo "VITE_PUBLIC_POSTHOG_KEY=$(gcloud secrets versions access latest --secret=VITE_PUBLIC_POSTHOG_KEY --project=$GCP_PROJECT_ID)" >> $GITHUB_ENV
          echo "VITE_PUBLIC_POSTHOG_HOST=$(gcloud secrets versions access latest --secret=VITE_PUBLIC_POSTHOG_HOST --project=$GCP_PROJECT_ID)" >> $GITHUB_ENV

      - name: Create env file
        run: |
          cat > .env.preview << 'EOF'
          NODE_OPTIONS=--max-old-space-size=6144
          VITE_DISABLE_SOURCEMAP=true
          VITE_SENTRY_TELEMETRY_DISABLED=true
          VITE_TEST_AUTH=true
          VITE_APP_TITLE=Ocotillo Preview
          VITE_BASE_URL=/
          VITE_AUTHENTIK_CLIENT_ID=${{ vars.VITE_AUTHENTIK_CLIENT_ID }}
          VITE_AUTHENTIK_URL=${{ vars.VITE_AUTHENTIK_URL }}
          VITE_AUTHENTIK_REDIRECT_URI=${{ vars.VITE_AUTHENTIK_REDIRECT_URI }}
          VITE_OCOTILLO_API_URL=${{ vars.VITE_OCOTILLO_API_URL }}
          VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_PUBLIC_POSTHOG_KEY=${{ env.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST=${{ env.VITE_PUBLIC_POSTHOG_HOST }}
          EOF

      - name: Build and push
        env:
          IMAGE_TAG: ${{ github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GCP_PROJECT_ID: waterdatainitiative-271000
          SANITIZED: $(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-40)
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -e
          echo "SANITIZED_BRANCH=$SANITIZED" >> $GITHUB_ENV

          npm ci
          npx tsc
          npx vite build --mode development

          docker build \
            --env-file .env.preview \
            --build-arg MODE=development \
            --build-arg VITE_TEST_AUTH=true \
            -t "us-central1-docker.pkg.dev/$GCP_PROJECT_ID/ocotillo-previews/preview-$SANITIZED-ocotillo:$IMAGE_TAG" .

          docker push "us-central1-docker.pkg.dev/$GCP_PROJECT_ID/ocotillo-previews/preview-$SANITIZED-ocotillo:$IMAGE_TAG"

      - name: Deploy to Cloud Run
        env:
          IMAGE_TAG: ${{ github.sha }}
          GCP_PROJECT_ID: waterdatainitiative-271000
        run: |
          gcloud run deploy preview-${{ env.SANITIZED_BRANCH }}-ocotillo \
            --image us-central1-docker.pkg.dev/$GCP_PROJECT_ID/ocotillo-previews/preview-${{ env.SANITIZED_BRANCH }}-ocotillo:$IMAGE_TAG \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1

      - name: Get preview URL
        id: preview-url
        run: |
          echo "url=$(gcloud run services describe preview-${{ env.SANITIZED_BRANCH }}-ocotillo --platform managed --region us-central1 --format 'value(status.url)')" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "## Preview Deployment

          **Preview URL:** $PREVIEW_URL

          **Note:** This preview uses the staging API endpoints and has auth disabled for testing."

      - name: Delete preview on PR close
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          GCP_PROJECT_ID: waterdatainitiative-271000
        run: |
          gcloud run services delete preview-${{ env.SANITIZED_BRANCH }}-ocotillo --platform managed --region us-central1 --quiet || true
