name: Preview deploy to Cloud Run

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches-ignore:
      - main
      - master
      - production
      - staging

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/production' && github.ref != 'refs/heads/staging')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        env:
          GCP_PROJECT_ID: waterdatainitiative-271000
        run: |
          gcloud config set project $GCP_PROJECT_ID
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          # Create repository if it doesn't exist
          gcloud artifacts repositories describe ocotillo-previews \
            --location=us-central1 2>/dev/null || \
            gcloud artifacts repositories create ocotillo-previews \
            --repository-format=docker \
            --location=us-central1

      - name: Load PostHog env vars from Secret Manager
        env:
          GCP_PROJECT_ID: waterdatainitiative-271000
        run: |
          set -euo pipefail

          KEY_SECRET="VITE_PUBLIC_POSTHOG_KEY"
          HOST_SECRET="VITE_PUBLIC_POSTHOG_HOST"

          VITE_POSTHOG_KEY="$(gcloud secrets versions access latest --secret="$KEY_SECRET" --project="$GCP_PROJECT_ID")"
          VITE_POSTHOG_HOST="$(gcloud secrets versions access latest --secret="$HOST_SECRET" --project="$GCP_PROJECT_ID")"

          echo "VITE_POSTHOG_KEY=$VITE_POSTHOG_KEY" >> "$GITHUB_ENV"
          echo "VITE_POSTHOG_HOST=$VITE_POSTHOG_HOST" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GCP_PROJECT_ID: waterdatainitiative-271000
        run: |
          set -e
          # Sanitize branch name for Cloud Run service name (alphanumeric and hyphens only)
          SANITIZED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-40)
          echo "SANITIZED_BRANCH=$SANITIZED" >> "$GITHUB_ENV"
          echo "Docker image tag: $IMAGE_TAG"

          export NODE_OPTIONS="--max-old-space-size=6144"
          export VITE_DISABLE_SOURCEMAP=true
          export VITE_SENTRY_TELEMETRY_DISABLED=true
          export VITE_APP_TITLE="Ocotillo Preview"
          export VITE_BASE_URL="/"
          export VITE_AUTHENTIK_CLIENT_ID="${{ vars.VITE_AUTHENTIK_CLIENT_ID }}"
          export VITE_AUTHENTIK_URL="${{ vars.VITE_AUTHENTIK_URL }}"
          export VITE_AUTHENTIK_REDIRECT_URI="${{ vars.VITE_AUTHENTIK_REDIRECT_URI }}"
          export VITE_OCOTILLO_API_URL="${{ vars.VITE_OCOTILLO_API_URL }}"
          export VITE_MAPBOX_TOKEN="${{ secrets.VITE_MAPBOX_TOKEN }}"
          export VITE_PUBLIC_POSTHOG_KEY="${{ env.VITE_POSTHOG_KEY }}"
          export VITE_PUBLIC_POSTHOG_HOST="${{ env.VITE_POSTHOG_HOST }}"

          npm ci
          npx tsc
          npx vite build --mode development

          IMAGE_NAME="us-central1-docker.pkg.dev/$GCP_PROJECT_ID/ocotillo-previews/preview-$SANITIZED-ocotillo:$IMAGE_TAG"
          docker build \
            --build-arg VITE_APP_TITLE="Ocotillo Preview" \
            --build-arg VITE_BASE_URL="/" \
            --build-arg VITE_AUTHENTIK_CLIENT_ID="${{ vars.VITE_AUTHENTIK_CLIENT_ID }}" \
            --build-arg VITE_AUTHENTIK_URL="${{ vars.VITE_AUTHENTIK_URL }}" \
            --build-arg VITE_AUTHENTIK_REDIRECT_URI="${{ vars.VITE_AUTHENTIK_REDIRECT_URI }}" \
            --build-arg VITE_OCOTILLO_API_URL="${{ vars.VITE_OCOTILLO_API_URL }}" \
            --build-arg VITE_MAPBOX_TOKEN="${{ secrets.VITE_MAPBOX_TOKEN }}" \
            --build-arg VITE_PUBLIC_POSTHOG_KEY="${{ env.VITE_POSTHOG_KEY }}" \
            --build-arg VITE_PUBLIC_POSTHOG_HOST="${{ env.VITE_POSTHOG_HOST }}" \
            -t "$IMAGE_NAME" .

          echo "Pushing image: $IMAGE_NAME"
          docker push "$IMAGE_NAME"
          echo "Verifying image was pushed..."
          docker manifest inspect "$IMAGE_NAME" && echo "Image verified successfully!"

      - name: Deploy to Cloud Run
        env:
          IMAGE_TAG: ${{ github.sha }}
          GCP_PROJECT_ID: waterdatainitiative-271000
        run: |
          set -e
          gcloud run deploy preview-${{ env.SANITIZED_BRANCH }}-ocotillo \
            --image us-central1-docker.pkg.dev/$GCP_PROJECT_ID/ocotillo-previews/preview-${{ env.SANITIZED_BRANCH }}-ocotillo:$IMAGE_TAG \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 60s

      - name: Get preview URL
        id: preview-url
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "url=$(gcloud run services describe preview-${{ env.SANITIZED_BRANCH }}-ocotillo --platform managed --region us-central1 --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER --body "## Preview Deployment" && \
          gh pr comment $PR_NUMBER --body "**Preview URL:** $PREVIEW_URL" && \
          gh pr comment $PR_NUMBER --body "**Note:** This preview uses the staging API endpoints."

      - name: Delete preview on PR close
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          GCP_PROJECT_ID: waterdatainitiative-271000
        run: |
          SERVICE_NAME="preview-${{ env.SANITIZED_BRANCH }}-ocotillo"
          echo "Deleting Cloud Run service: $SERVICE_NAME"
          gcloud run services delete "$SERVICE_NAME" --platform managed --region us-central1 --quiet || true
          gcloud artifacts docker images delete us-central1-docker.pkg.dev/$GCP_PROJECT_ID/ocotillo-previews/"$SERVICE_NAME":${{ github.sha }} --quiet || true
