    <!-- Patch pdf.js worker URL globally before any module loads -->
    <script>
      window.pdfjsLib = window.pdfjsLib || {};
      // react-pdf v10 sets GlobalWorkerOptions.workerSrc to 'pdf.worker.mjs' (bare spec),
      // which Vite cannot resolve.  Overwrite with CDN-hosted worker matching our pdfjs-dist version.
      window.pdfjsLib.GlobalWorkerOptions = {
        workerSrc: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.7.284/pdf.worker.min.mjs'
      };
    </script>

    <!-- Buffer polyfill for react-pdf in browsers. 
         react-pdf uses Node.js Buffer internals (for image data) which don't exist in browsers.
         Without this shim the PDFViewer stays empty regardless of content. -->
    <script>
      if (typeof globalThis.global === 'undefined') {
        Object.defineProperty(globalThis, 'global', { value: globalThis, configurable: true })
      }
      if (typeof globalThis.Buffer === 'undefined') {
        var encoder = new TextEncoder()
        function _createBuffer(data) {
          if (data instanceof Uint8Array) return data
          if (typeof data === 'string') return encoder.encode(data)
          return new Uint8Array(data || [])
        }
        globalThis.Buffer = {
          isBuffer: function(obj) { return obj instanceof Uint8Array },
          from: _createBuffer,
          concat: function(buffers) {
            var total = 0
            for (var i = 0; i < buffers.length; i++) total += buffers[i].length
            var result = new Uint8Array(total)
            var offset = 0
            for (i = 0; i < buffers.length; i++) { result.set(buffers[i], offset); offset += buffers[i].length }
            return result
          }
        }
      }
    </script>
  </head>

  <body>
